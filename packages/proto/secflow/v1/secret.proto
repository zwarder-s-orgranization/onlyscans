syntax = "proto3";

package secflow.v1;

import "google/protobuf/timestamp.proto";
import "secflow/v1/common.proto";

// SecretService manages encrypted node secrets (AES-256-GCM in PostgreSQL or
// OpenBao/Vault KV v2 via pluggable SecretStore) and scoped CI / MCP API tokens.
// Raw secret values are NEVER returned by ListMaskedSecrets or any UI/GraphQL API.
service SecretService {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ListMaskedSecrets(ListMaskedSecretsRequest) returns (ListMaskedSecretsResponse);

  // Least-privilege scoped secret resolution called ONLY by authenticated internal
  // services (notify-service, mcp-bridge, source-ingester, ai-service, edge-gateway).
  // NEVER trusts a bare self-declared plugin_id:
  // - NodeTaskSecretScope requires a valid orchestrator-signed task_lease_token bound
  //   to (run_id, node_run_id, node_id, plugin_id) AND rejects analyzer/SBOM plugins.
  // - WorkflowWebhookSecretScope, CommitStatusSecretScope, and MCPDiscoverySecretScope
  //   require verified internal service identity (mTLS SPIFFE/cert or internal service token).
  rpc ResolveScopedSecret(ResolveScopedSecretRequest) returns (ResolveScopedSecretResponse);

  // Scoped API Tokens for ★2 CI/CD (ci:startRun, ci:readRun) and T10 MCP (mcp:read, mcp:run, mcp:write).
  rpc IssueScopedToken(IssueScopedTokenRequest) returns (IssueScopedTokenResponse);
  rpc ListScopedTokens(ListScopedTokensRequest) returns (ListScopedTokensResponse);
  rpc RevokeScopedToken(RevokeScopedTokenRequest) returns (RevokeScopedTokenResponse);
  rpc VerifyScopedToken(VerifyScopedTokenRequest) returns (VerifyScopedTokenResponse);
}

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  SECRET_KIND_TELEGRAM_BOT_TOKEN = 1;
  SECRET_KIND_WEBHOOK_HMAC_SECRET = 2;
  SECRET_KIND_SMTP_PASSWORD = 3;
  SECRET_KIND_GIT_TOKEN = 4;
  SECRET_KIND_GIT_WEBHOOK_SECRET = 5;
  SECRET_KIND_LLM_API_KEY = 6;
  SECRET_KIND_MCP_AUTH_HEADER = 7;
  SECRET_KIND_GENERIC = 8;
}

enum SecretStoreBackend {
  SECRET_STORE_BACKEND_UNSPECIFIED = 0;
  SECRET_STORE_BACKEND_PG_AES = 1;
  SECRET_STORE_BACKEND_VAULT = 2;
}

message SecretMetadata {
  string secret_ref = 1;                 // Opaque stable reference ID stored in WorkflowNode.secret_bindings
  string name = 2;
  SecretKind kind = 3;
  string masked_preview = 4;             // e.g. "****...a9f2" (never full plaintext)
  SecretStoreBackend backend = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateSecretRequest {
  ActorContext actor = 1;
  string name = 2;
  SecretKind kind = 3;
  string plaintext_value = 4;            // Encrypted immediately; never logged or traced
}

message CreateSecretResponse {
  SecretMetadata secret = 1;
}

message DeleteSecretRequest {
  ActorContext actor = 1;
  string secret_ref = 2;
}

message DeleteSecretResponse {
  bool deleted = 1;
}

message ListMaskedSecretsRequest {
  ActorContext actor = 1;
  SecretKind kind = 2;                   // Optional filter
}

message ListMaskedSecretsResponse {
  repeated SecretMetadata secrets = 1;
}

// Scope 1: Runtime NodeTask resolution (notify.*, source.git, ai.explain, mcp.tool).
message NodeTaskSecretScope {
  string run_id = 1;
  string node_run_id = 2;
  string node_id = 3;
  string plugin_id = 4;
  // Orchestrator-signed short-lived lease token issued in NodeTask.task_lease_token.
  // Prevents any analyzer worker from spoofing plugin_id / node_id.
  string task_lease_token = 5;
}

// Scope 2: Pre-run webhook HMAC/token verification by edge-gateway on POST /webhooks/git/{workflowId}.
message WorkflowWebhookSecretScope {
  string workflow_id = 1;
  string trigger_node_id = 2;
}

// Scope 3: Commit Status API callback by notify-service using gitStatusToken bound to trigger.webhook.
message CommitStatusSecretScope {
  string run_id = 1;
  string workflow_id = 2;
  string trigger_node_id = 3;
}

// Scope 4: Static MCP Connection discovery (tools/list, TestConnection) by mcp-bridge outside a Run.
message MCPDiscoverySecretScope {
  string mcp_connection_id = 1;
}

message ResolveScopedSecretRequest {
  string secret_ref = 1;
  // Internal service attestation token (or verified mTLS peer identity in K8s) required for
  // service-level scopes (webhook verification, commit status, MCP discovery).
  string service_token = 2;
  oneof scope {
    NodeTaskSecretScope node_task = 3;
    WorkflowWebhookSecretScope workflow_webhook = 4;
    CommitStatusSecretScope commit_status = 5;
    MCPDiscoverySecretScope mcp_discovery = 6;
  }
}

message ResolveScopedSecretResponse {
  string secret_ref = 1;
  string plaintext_value = 2;            // Transmitted only over internal cluster gRPC; never logged
}

message ScopedTokenMetadata {
  string token_id = 1;
  string name = 2;
  string token_prefix = 3;               // e.g. "sf_ci_7x2a..."
  repeated string scopes = 4;            // "ci:startRun", "ci:readRun", "mcp:read", "mcp:run", "mcp:write"
  string workflow_id = 5;                // Optional: restricts token to a single Workflow
  string created_by = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp last_used_at = 8;
  google.protobuf.Timestamp revoked_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message IssueScopedTokenRequest {
  ActorContext actor = 1;
  string name = 2;
  repeated string scopes = 3;
  string workflow_id = 4;                // Required when issuing ci:* tokens
  google.protobuf.Timestamp expires_at = 5;
}

message IssueScopedTokenResponse {
  ScopedTokenMetadata metadata = 1;
  string plaintext_token = 2;            // Shown ONCE at creation; stored only as SHA-256 hash
}

message ListScopedTokensRequest {
  ActorContext actor = 1;
}

message ListScopedTokensResponse {
  repeated ScopedTokenMetadata tokens = 1;
}

message RevokeScopedTokenRequest {
  ActorContext actor = 1;
  string token_id = 2;
}

message RevokeScopedTokenResponse {
  bool revoked = 1;
}

message VerifyScopedTokenRequest {
  string plaintext_token = 1;
}

message VerifyScopedTokenResponse {
  bool valid = 1;
  ActorContext actor = 2;
  string token_id = 3;
}
