syntax = "proto3";

package secflow.v1;

import "google/protobuf/timestamp.proto";
import "secflow/v1/common.proto";

// NotifyService exposes orchestrator-initiated lifecycle callbacks on notify-service
// that run outside downstream notify.* DAG nodes — specifically GitHub/GitLab Commit
// Status API updates (★2 / T9: pending on Run start -> success / failure on Run finish).
// Note: DAG nodes notify.telegram, notify.webhook, notify.smtp still execute via
// WorkerService.Connect (ADR-0001).
service NotifyService {
  rpc SendCommitStatus(SendCommitStatusRequest) returns (SendCommitStatusResponse);
}

enum CommitStatusState {
  COMMIT_STATUS_STATE_UNSPECIFIED = 0;
  COMMIT_STATUS_STATE_PENDING = 1;
  COMMIT_STATUS_STATE_SUCCESS = 2;
  COMMIT_STATUS_STATE_FAILURE = 3;
  COMMIT_STATUS_STATE_ERROR = 4;
}

message SendCommitStatusRequest {
  string run_id = 1;
  string workflow_id = 2;
  string trigger_node_id = 3;
  GitProvider git_provider = 4;
  string commit_status_url = 5;          // Derived from webhook payload (e.g. GitHub statuses_url / GitLab statuses API)
  string commit_sha = 6;
  CommitStatusState state = 7;           // PENDING on start; SUCCESS / FAILURE / ERROR on finish
  string context = 8;                    // Default "secflow/security-gate"
  string description = 9;                // Short summary (never contains raw secrets)
  string target_url = 10;                // Direct UI link to the Run (e.g. "https://secflow.local/runs/{run_id}")
  string git_status_secret_ref = 11;     // Resolved by notify-service via SecretService.ResolveScopedSecret(CommitStatusSecretScope)
  string traceparent = 12;               // W3C Trace Context propagated end-to-end
}

message SendCommitStatusResponse {
  bool delivered = 1;
  int32 http_status = 2;
  string error_message = 3;              // Redacted error message on failure
  google.protobuf.Timestamp sent_at = 4;
}
