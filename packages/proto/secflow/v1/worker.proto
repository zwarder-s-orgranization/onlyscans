syntax = "proto3";

package secflow.v1;

import "google/protobuf/timestamp.proto";
import "secflow/v1/common.proto";

// ============================================================================
// Unified Pull Plugin Protocol (ADR-0001)
//
// EVERY built-in and external worker (worker-kotlin, worker-sca, sbom-service,
// ai-service, notify-service, mcp-bridge, and external secflow-sandbox plugins)
// connects OUTBOUND as a gRPC client to orchestrator:50051.
// Zero inbound ports or Kubernetes Services are required in secflow-sandbox.
// ============================================================================

service WorkerService {
  // Long-lived bidirectional stream:
  // 1. Worker sends RegisterManifest (handshake).
  // 2. Orchestrator verifies scanner deny-list (blocks semgrep/gitleaks/trivy/detekt-security)
  //    and replies with ManifestAck (accepted or rejected with reason).
  // 3. Orchestrator pushes leased NodeTask messages (acquired via PG FOR UPDATE SKIP LOCKED)
  //    carrying an orchestrator-signed task_lease_token for least-privilege SecretService access.
  // 4. Worker sends Heartbeat to extend lease_until, optional TaskProgress, and CompleteTask
  //    with idempotent node_run_id.
  // 5. Orchestrator may send CancelTask (run cancelled / timeout) or DrainRequest.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

// PluginRegistryService serves registered built-in + live connected plugins
// (including hot-plugged external sandbox plugins) to edge-gateway / UI / AI.
service PluginRegistryService {
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse);
  // Server-stream emitting REGISTERED / UPDATED / OFFLINE events so UI palette
  // updates in real time without restarting edge-gateway, orchestrator, or web.
  rpc WatchPlugins(WatchPluginsRequest) returns (stream WatchPluginsResponse);

  // Plugin Installation control plane (ADR-0010, Ticket #28).
  rpc ListPluginInstallations(ListPluginInstallationsRequest) returns (ListPluginInstallationsResponse);
  rpc GetPluginInstallation(GetPluginInstallationRequest) returns (GetPluginInstallationResponse);
  rpc ListPluginPresets(ListPluginPresetsRequest) returns (ListPluginPresetsResponse);
  rpc InstallPlugin(InstallPluginRequest) returns (InstallPluginResponse);
  rpc ApprovePluginInstallation(ApprovePluginInstallationRequest) returns (ApprovePluginInstallationResponse);
  rpc UpdatePluginInstallation(UpdatePluginInstallationRequest) returns (UpdatePluginInstallationResponse);
  rpc SetPluginInstallationEnabled(SetPluginInstallationEnabledRequest) returns (SetPluginInstallationEnabledResponse);
  rpc DeletePluginInstallation(DeletePluginInstallationRequest) returns (DeletePluginInstallationResponse);
  rpc WatchPluginInstallations(WatchPluginInstallationsRequest) returns (stream WatchPluginInstallationsResponse);

  // Declarative Plugin Builder & Saved Nodes (ADR-0011, Spec #33).
  rpc TestDeclarativePlugin(TestDeclarativePluginRequest) returns (TestDeclarativePluginResponse);
  rpc ListDeclarativeSpecs(ListDeclarativeSpecsRequest) returns (ListDeclarativeSpecsResponse);
  rpc ListSavedNodes(ListSavedNodesRequest) returns (ListSavedNodesResponse);
  rpc SaveNode(SaveNodeRequest) returns (SaveNodeResponse);
  rpc UpdateSavedNode(UpdateSavedNodeRequest) returns (UpdateSavedNodeResponse);
  rpc DeleteSavedNode(DeleteSavedNodeRequest) returns (DeleteSavedNodeResponse);
}

enum SandboxProfile {
  SANDBOX_PROFILE_UNSPECIFIED = 0;
  SANDBOX_PROFILE_ORCHESTRATOR_BUILTIN = 1;
  SANDBOX_PROFILE_INTERNAL_ONLY = 2;    // Zero internet egress (analyzers, SBOM, external sandbox)
  SANDBOX_PROFILE_EGRESS_EXTERNAL = 3;  // Allowlisted external egress (source-ingester, ai-service, notify-service, mcp-bridge)
}

enum ManifestRejectionCode {
  MANIFEST_REJECTION_CODE_UNSPECIFIED = 0;
  MANIFEST_REJECTION_CODE_DENYLIST_BLOCKED = 1;
  MANIFEST_REJECTION_CODE_INVALID_SCHEMA = 2;
  MANIFEST_REJECTION_CODE_DUPLICATE_PLUGIN_ID = 3;
  MANIFEST_REJECTION_CODE_UNSUPPORTED_VERSION = 4;
  MANIFEST_REJECTION_CODE_UNAUTHENTICATED = 5;
  MANIFEST_REJECTION_CODE_BUILTIN_OVERRIDE_FORBIDDEN = 6;
  MANIFEST_REJECTION_CODE_UNSUPPORTED_CATEGORY = 7;
  MANIFEST_REJECTION_CODE_SANDBOX_PROFILE_MISMATCH = 8;
}

message PortDefinition {
  string id = 1;                         // e.g. "default", "true", "false", "CRITICAL"
  string label = 2;
  string description = 3;
}

message PluginManifest {
  string plugin_id = 1;                  // e.g. "scan.secrets", "scan.spring-config"
  string version = 2;                    // SemVer, e.g. "1.0.0"
  string display_name = 3;
  string description = 4;
  PluginCategory category = 5;
  repeated string capabilities = 6;      // e.g. ["analyzer"], ["sbom"], ["ai"], ["report"], ["notify"], ["mcp"]
  bytes params_json_schema = 7;          // JSON Schema Draft 2020-12 -> auto-generates UI Inspector form
  repeated PortDefinition input_ports = 8;
  repeated PortDefinition output_ports = 9;
  string runtime_language = 10;          // "go" | "kotlin-jvm" | "python" | etc.
  SandboxProfile sandbox_profile = 11;
  bool is_external = 12;                 // True for secflow-sandbox hot-plug containers
  repeated string required_secret_keys = 13; // Logical param keys that must be bound via secret_bindings
  int32 max_concurrency = 14;            // Max concurrent NodeTasks this worker instance can lease
}

message WorkerRegisterManifest {
  string worker_instance_id = 1;         // Pod name / unique instance UUID
  string namespace = 2;                  // e.g. "secflow-workers" | "secflow-sandbox"
  repeated PluginManifest manifests = 3; // A single worker (e.g. worker-kotlin) may register multiple plugins
}

message WorkerHeartbeat {
  string worker_instance_id = 1;
  repeated string active_node_run_ids = 2; // Extends PG lease_until for all listed active tasks
  int32 available_slots = 3;
}

message WorkerTaskProgress {
  string node_run_id = 1;
  int32 percent = 2;                     // 0..100
  string status_message = 3;             // Safe redacted status line (no secrets/code)
}

message NodeTaskMetrics {
  int64 duration_ms = 1;
  int32 files_scanned = 2;
  int64 bytes_processed = 3;
  int32 tokens_in = 4;
  int32 tokens_out = 5;
}

message NodeResult {
  string node_run_id = 1;                // Idempotency key
  string run_id = 2;
  string node_id = 3;
  string plugin_id = 4;
  NodeRunStatus status = 5;              // NODE_RUN_STATUS_SUCCEEDED | NODE_RUN_STATUS_FAILED
  repeated Finding findings = 6;         // New findings emitted by analyzer plugins (masked secrets!)
  bytes envelope_patch_json = 7;         // Patch applied to branch Envelope: sbomRef / aiReport / vars / gate
  repeated string active_output_ports = 8; // Default ["default"]; branching nodes return chosen handles
  string payload_s3_key = 9;             // Optional large output artifact key in Garage
  bytes redacted_preview_json = 10;      // Lightweight redacted preview for runEvents
  string error_code = 11;
  string error_message = 12;             // Redacted error message (never raw secrets)
  NodeTaskMetrics metrics = 13;
}

message WorkerDrainNotice {
  string worker_instance_id = 1;
  string reason = 2;
}

message ConnectRequest {
  oneof payload {
    WorkerRegisterManifest register_manifest = 1;
    WorkerHeartbeat heartbeat = 2;
    WorkerTaskProgress task_progress = 3;
    NodeResult complete_task = 4;
    WorkerDrainNotice drain = 5;
  }
}

message ManifestAck {
  bool accepted = 1;
  ManifestRejectionCode rejection_code = 2;
  string rejection_reason = 3;
  int64 heartbeat_interval_seconds = 4;  // Recommended heartbeat cadence (e.g. 10s)
  int64 default_lease_seconds = 5;       // Default PG lease duration (e.g. 30s)
}

message NodeTask {
  string run_id = 1;
  string node_run_id = 2;                // Unique idempotency key for this attempt
  string node_id = 3;
  string plugin_id = 4;
  bytes params_json = 5;                 // Resolved node parameters (safe {{ ... }} already evaluated)
  bytes envelope_json = 6;               // Current branch-local Envelope JSON (sourceRef, findings, refs, stats)
  repeated SecretBinding secret_bindings = 7; // paramKey -> secretRef ONLY bound to this node (least privilege)
  string traceparent = 8;                // W3C Trace Context propagated end-to-end
  int64 lease_seconds = 9;
  int64 hard_timeout_seconds = 10;
  int32 attempt = 11;
  // Short-lived orchestrator-signed token bound to (run_id, node_run_id, node_id, plugin_id).
  // Required by SecretService.ResolveScopedSecret so analyzer workers cannot impersonate another plugin_id.
  // Always empty for analyzer/SBOM/external-sandbox plugins without granted secret access.
  string task_lease_token = 12;
}

message CancelTask {
  string node_run_id = 1;
  string reason = 2;
}

message HeartbeatAck {
  google.protobuf.Timestamp server_time = 1;
  repeated string expired_node_run_ids = 2; // Tasks whose lease was lost and should be aborted locally
}

message DrainRequest {
  string reason = 1;
  int64 grace_period_seconds = 2;
}

message ConnectResponse {
  oneof payload {
    ManifestAck manifest_ack = 1;
    NodeTask dispatch_task = 2;
    CancelTask cancel_task = 3;
    HeartbeatAck heartbeat_ack = 4;
    DrainRequest drain_request = 5;
  }
}

// ============================================================================
// Plugin Registry Models
// ============================================================================

message RegisteredPlugin {
  PluginManifest manifest = 1;
  PluginStatus status = 2;
  int32 active_workers = 3;
  int64 queue_depth = 4;                 // Mirrors orchestrator_queue_depth{plugin_id}
  google.protobuf.Timestamp registered_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  string installation_id = 7;
  bool enabled = 8;
  bool approval_pending = 9;
}

message ListPluginsRequest {
  ActorContext actor = 1;
  PluginCategory category = 2;           // Optional filter
  bool include_offline = 3;
  bool include_disabled = 4;
}

message ListPluginsResponse {
  repeated RegisteredPlugin plugins = 1;
}

message GetPluginRequest {
  ActorContext actor = 1;
  string plugin_id = 2;
}

message GetPluginResponse {
  RegisteredPlugin plugin = 1;
}

message WatchPluginsRequest {
  ActorContext actor = 1;
}

message WatchPluginsResponse {
  PluginRegistryEvent event = 1;
}

enum PluginRegistryEventType {
  PLUGIN_REGISTRY_EVENT_TYPE_UNSPECIFIED = 0;
  PLUGIN_REGISTRY_EVENT_TYPE_REGISTERED = 1;
  PLUGIN_REGISTRY_EVENT_TYPE_UPDATED = 2;
  PLUGIN_REGISTRY_EVENT_TYPE_OFFLINE = 3;
}

message PluginRegistryEvent {
  PluginRegistryEventType event_type = 1;
  RegisteredPlugin plugin = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// ============================================================================
// Plugin Installation Control Plane (ADR-0010, Ticket #28)
// ============================================================================

enum PluginInstallationStatus {
  PLUGIN_INSTALLATION_STATUS_UNSPECIFIED = 0;
  PLUGIN_INSTALLATION_STATUS_PROVISIONING = 1;
  PLUGIN_INSTALLATION_STATUS_PENDING_APPROVAL = 2;
  PLUGIN_INSTALLATION_STATUS_ACTIVE = 3;
  PLUGIN_INSTALLATION_STATUS_DISABLED = 4;
  PLUGIN_INSTALLATION_STATUS_ERROR = 5;
  PLUGIN_INSTALLATION_STATUS_DELETING = 6;
  PLUGIN_INSTALLATION_STATUS_DRAFT = 7;
}

enum PluginSourceMode {
  PLUGIN_SOURCE_MODE_UNSPECIFIED = 0;
  PLUGIN_SOURCE_MODE_PRESET = 1;
  PLUGIN_SOURCE_MODE_OCI_IMAGE = 2;
  PLUGIN_SOURCE_MODE_EXTERNAL_PULL = 3;
  PLUGIN_SOURCE_MODE_DECLARATIVE = 4;
}

enum PluginInstallationEventType {
  PLUGIN_INSTALLATION_EVENT_TYPE_UNSPECIFIED = 0;
  PLUGIN_INSTALLATION_EVENT_TYPE_CREATED = 1;
  PLUGIN_INSTALLATION_EVENT_TYPE_UPDATED = 2;
  PLUGIN_INSTALLATION_EVENT_TYPE_APPROVED = 3;
  PLUGIN_INSTALLATION_EVENT_TYPE_STATUS_CHANGED = 4;
  PLUGIN_INSTALLATION_EVENT_TYPE_DELETED = 5;
}

message PluginResourceLimits {
  string cpu_request = 1;
  string cpu_limit = 2;
  string memory_request = 3;
  string memory_limit = 4;
  int32 min_replicas = 5;
  int32 max_replicas = 6;
}

message PluginRuntimeDiagnostics {
  string phase = 1;
  int32 desired_replicas = 2;
  int32 ready_replicas = 3;
  string message = 4;
  string last_error = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message PluginInstallation {
  string id = 1;
  string name = 2;
  PluginSourceMode source_mode = 3;
  string preset_id = 4;
  string image_ref = 5;
  SandboxProfile sandbox_profile = 6;
  repeated string egress_allowlist = 7;
  PluginResourceLimits resource_limits = 8;
  int32 desired_replicas = 9;
  PluginInstallationStatus status = 10;
  bool auto_approve = 11;
  string approved_manifest_digest = 12;
  repeated PluginManifest manifests = 13;
  repeated PluginManifest pending_manifests = 14;
  repeated string plugin_ids = 15;
  PluginRuntimeDiagnostics runtime_diagnostics = 16;
  string created_by = 17;
  string approved_by = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  google.protobuf.Timestamp approved_at = 21;
  string status_reason = 22;
  bytes declarative_spec_json = 23;
  bytes pending_declarative_spec_json = 24;
  string plugin_version = 25;
}

message PluginPreset {
  string id = 1;
  string name = 2;
  string description = 3;
  string image_ref = 4;
  PluginCategory category = 5;
  SandboxProfile sandbox_profile = 6;
  repeated string plugin_ids = 7;
  repeated PortDefinition output_ports = 8;
  repeated string required_secret_keys = 9;
  repeated string default_egress_allowlist = 10;
  PluginResourceLimits default_resource_limits = 11;
  bool auto_approve_supported = 12;
}

message ListPluginInstallationsRequest {
  ActorContext actor = 1;
}

message ListPluginInstallationsResponse {
  repeated PluginInstallation installations = 1;
}

message GetPluginInstallationRequest {
  ActorContext actor = 1;
  string installation_id = 2;
}

message GetPluginInstallationResponse {
  PluginInstallation installation = 1;
}

message ListPluginPresetsRequest {
  ActorContext actor = 1;
}

message ListPluginPresetsResponse {
  repeated PluginPreset presets = 1;
}

message InstallPluginRequest {
  ActorContext actor = 1;
  string name = 2;
  PluginSourceMode source_mode = 3;
  string preset_id = 4;
  string image_ref = 5;
  SandboxProfile sandbox_profile = 6;
  repeated string egress_allowlist = 7;
  PluginResourceLimits resource_limits = 8;
  int32 desired_replicas = 9;
  bool auto_approve = 10;
  bytes declarative_spec_json = 11;
  bool save_as_draft = 12;
}

message InstallPluginResponse {
  PluginInstallation installation = 1;
  string plaintext_plugin_token = 2;
}

message ApprovePluginInstallationRequest {
  ActorContext actor = 1;
  string installation_id = 2;
  string expected_manifest_digest = 3;
}

message ApprovePluginInstallationResponse {
  PluginInstallation installation = 1;
}

message UpdatePluginInstallationRequest {
  ActorContext actor = 1;
  string installation_id = 2;
  string image_ref = 3;
  SandboxProfile sandbox_profile = 4;
  repeated string egress_allowlist = 5;
  PluginResourceLimits resource_limits = 6;
  int32 desired_replicas = 7;
  bool rotate_token = 8;
  PluginRuntimeDiagnostics runtime_diagnostics = 9;
  PluginInstallationStatus status = 10;
  string status_reason = 11;
  bytes declarative_spec_json = 12;
  bool submit_for_approval = 13;
  bool approve_immediately = 14;
}

message UpdatePluginInstallationResponse {
  PluginInstallation installation = 1;
  string plaintext_plugin_token = 2;
}

message SetPluginInstallationEnabledRequest {
  ActorContext actor = 1;
  string installation_id = 2;
  bool enabled = 3;
  string reason = 4;
}

message SetPluginInstallationEnabledResponse {
  PluginInstallation installation = 1;
}

message DeletePluginInstallationRequest {
  ActorContext actor = 1;
  string installation_id = 2;
  string reason = 3;
}

message DeletePluginInstallationResponse {
  bool deleted = 1;
}

message WatchPluginInstallationsRequest {
  ActorContext actor = 1;
  string installation_id = 2;
}

message WatchPluginInstallationsResponse {
  PluginInstallationEvent event = 1;
}

message PluginInstallationEvent {
  PluginInstallationEventType event_type = 1;
  PluginInstallation installation = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// ============================================================================
// Declarative Plugin Builder & Saved Nodes (ADR-0011, Spec #33)
// ============================================================================

message VirtualFile {
  string path = 1;
  string content = 2;
}

message TestDeclarativePluginRequest {
  ActorContext actor = 1;
  bytes declarative_spec_json = 2;
  bytes params_json = 3;
  repeated VirtualFile files = 4;
  bytes envelope_json = 5;
}

message TestDeclarativePluginResponse {
  bool ok = 1;
  repeated string validation_errors = 2;
  repeated Finding findings = 3;
  repeated string active_output_ports = 4;
  bytes envelope_patch_json = 5;
  bytes dry_run_http_json = 6;
  int64 duration_ms = 7;
  string summary = 8;
}

message DeclarativeSpecRecord {
  string installation_id = 1;
  string plugin_id = 2;
  string version = 3;
  SandboxProfile sandbox_profile = 4;
  repeated string egress_allowlist = 5;
  bytes declarative_spec_json = 6;
  PluginManifest manifest = 7;
}

message ListDeclarativeSpecsRequest {
  SandboxProfile sandbox_profile = 1;
}

message ListDeclarativeSpecsResponse {
  repeated DeclarativeSpecRecord specs = 1;
}

message SavedNode {
  string id = 1;
  string name = 2;
  string description = 3;
  string plugin_id = 4;
  bytes params_json = 5;
  string canonical_params_hash = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListSavedNodesRequest {
  ActorContext actor = 1;
}

message ListSavedNodesResponse {
  repeated SavedNode saved_nodes = 1;
}

message SaveNodeRequest {
  ActorContext actor = 1;
  string name = 2;
  string description = 3;
  string plugin_id = 4;
  bytes params_json = 5;
}

message SaveNodeResponse {
  SavedNode saved_node = 1;
}

message UpdateSavedNodeRequest {
  ActorContext actor = 1;
  string id = 2;
  string name = 3;
  string description = 4;
  bytes params_json = 5;
}

message UpdateSavedNodeResponse {
  SavedNode saved_node = 1;
}

message DeleteSavedNodeRequest {
  ActorContext actor = 1;
  string id = 2;
}

message DeleteSavedNodeResponse {
  bool deleted = 1;
}
