version: "2"
run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    # style & naming
    - gocritic
    - revive
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    # complexity
    - gocyclo
    - nestif
    - funlen
    - dupl
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    - goconst
    # security, resources & SecFlow invariants
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - containedctx
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    - depguard
    # gRPC / protobuf & OpenTelemetry / slog (SecFlow stack)
    - protogetter
    - spancheck
    - sloglint
    - loggercheck
    # testing
    - testifylint
    - thelper
    - usetesting
    - paralleltest
    # modernization & meta
    - modernize
    - exptostd
    - intrange
    - usestdlibvars
    - exhaustive
    - nolintlint

  disable:
    - lll
    - prealloc
    - wrapcheck
    - err113
    - mnd
    - iface
    - nakedret
    - noinlineerr
    - gocognit
    - cyclop
    - goheader
    - importas
    - funcorder
    - godoclint
    - varnamelen
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - unparam
    - makezero
    - testpackage
    - embeddedstructfieldcheck
    - iotamixing
    - unqueryvet
    - recvcheck
    - mirror
    - zerologlint

  exclusions:
    generated: lax
    paths:
      - vendor$
      - third_party$
      - testutils$
      - examples$
      - tests/data/repos/mentor-training$

  settings:
    depguard:
      rules:
        secflow-brief-invariants:
          files:
            - $all
          deny:
            - pkg: github.com/aquasecurity/trivy
              desc: "SecFlow brief forbids wrapping Trivy; build custom deterministic Go SCA/SBOM analyzers."
            - pkg: github.com/zricethezav/gitleaks
              desc: "SecFlow brief forbids wrapping Gitleaks; build custom deterministic analyzers."
            - pkg: github.com/gitleaks/gitleaks
              desc: "SecFlow brief forbids wrapping Gitleaks; build custom deterministic analyzers."
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      min-complexity: 13
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - vendor$
      - third_party$
      - tests/data/repos/mentor-training$
