apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-provisioner
  namespace: secflow-core
  labels:
    app: plugin-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-provisioner
  template:
    metadata:
      labels:
        app: plugin-provisioner
    spec:
      serviceAccountName: plugin-provisioner
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plugin-provisioner
          image: ghcr.io/secflow/plugin-provisioner:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
          env:
            - name: PROVISIONER_DRIVER
              value: k8s
            - name: SECFLOW_ENV
              value: production
            - name: SANDBOX_NAMESPACE
              value: secflow-sandbox
            - name: ORCHESTRATOR_ADDR
              value: orchestrator.secflow-core.svc.cluster.local:50051
            - name: ORCHESTRATOR_NAMESPACE
              value: secflow-core
            - name: GARAGE_ENDPOINT
              value: http://garage.secflow-core.svc.cluster.local:3900
            - name: GARAGE_NAMESPACE
              value: secflow-core
            - name: PLUGIN_IMAGE_REGISTRY_ALLOWLIST
              value: ghcr.io/secflow
            - name: ENABLE_KEDA
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secflow-db
                  key: DATABASE_URL
            - name: GARAGE_RO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-ro
                  key: ACCESS_KEY_ID
                  optional: true
            - name: GARAGE_RO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-ro
                  key: SECRET_ACCESS_KEY
                  optional: true
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
