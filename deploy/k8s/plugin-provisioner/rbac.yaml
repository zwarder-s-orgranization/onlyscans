apiVersion: v1
kind: Namespace
metadata:
  name: secflow-sandbox
  labels:
    kubernetes.io/metadata.name: secflow-sandbox
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plugin-provisioner
  namespace: secflow-core
automountServiceAccountToken: true
---
# Minimal namespace-scoped Role strictly limited to secflow-sandbox (ADR-0010).
# No ClusterRole or cross-namespace privileges are ever granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secflow-plugin-provisioner
  namespace: secflow-sandbox
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secflow-plugin-provisioner
  namespace: secflow-sandbox
subjects:
  - kind: ServiceAccount
    name: plugin-provisioner
    namespace: secflow-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secflow-plugin-provisioner
