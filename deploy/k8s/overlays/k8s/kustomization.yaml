apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: orchestrator
      namespace: secflow-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: edge-gateway
      namespace: secflow-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: web
      namespace: secflow-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: secflow
      namespace: secflow-app
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          nginx.ingress.kubernetes.io/proxy-body-size: "64m"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
