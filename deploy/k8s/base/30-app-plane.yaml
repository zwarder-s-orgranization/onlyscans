apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: secflow-app
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secflow-orchestrator-worker-scaler
  namespace: secflow-workers
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secflow-orchestrator-worker-scaler
  namespace: secflow-workers
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: secflow-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secflow-orchestrator-worker-scaler
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: secflow-app
  labels:
    app: orchestrator
spec:
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8081
      targetPort: http
  selector:
    app: orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: secflow-app
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: ghcr.io/secflow/orchestrator:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8081
          env:
            - name: SECFLOW_ENV
              value: development
            - name: GRPC_ADDR
              value: ":50051"
            - name: HTTP_ADDR
              value: ":8081"
            - name: ORCHESTRATOR_MAX_CONCURRENT_TASKS
              value: "32"
            - name: REQUIRE_WORKER_SERVICE_TOKEN
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secflow-db
                  key: DATABASE_URL
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secflow-auth
                  key: SERVICE_TOKEN
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-auth
                  key: SECRET_KEY
            - name: LEASE_SECRET
              valueFrom:
                secretKeyRef:
                  name: secflow-auth
                  key: LEASE_SECRET
            - name: INGESTER_ADDR
              value: source-ingester.secflow-app.svc.cluster.local:50052
            - name: NOTIFY_ADDR
              value: notify-service.secflow-workers.svc.cluster.local:50054
            - name: GARAGE_ENDPOINT
              value: http://garage.secflow-system.svc.cluster.local:3900
            - name: GARAGE_ADMIN_URL
              value: http://garage.secflow-system.svc.cluster.local:3903
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-admin
                  key: GARAGE_ADMIN_TOKEN
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-creds
                  key: GARAGE_ACCESS_KEY
                  optional: true
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-creds
                  key: GARAGE_SECRET_KEY
                  optional: true
            - name: SECFLOW_PUBLIC_URL
              value: http://secflow.local
            - name: REPO_ALLOWLIST
              value: github.com/TBagirov/training
            - name: WORKER_SCALER_DRIVER
              value: k8s
            - name: WORKERS_NAMESPACE
              value: secflow-workers
            - name: ORCHESTRATOR_INTERNAL_ADDR
              value: orchestrator.secflow-app.svc.cluster.local:50051
            - name: WORKER_GARAGE_SECRET_NAME
              value: secflow-garage-creds
            - name: WORKER_AUTH_SECRET_NAME
              value: secflow-worker-auth
            - name: WORKER_DB_SECRET_NAME
              value: secflow-db
            - name: WORKER_REDIS_ADDR
              value: redis.secflow-system.svc.cluster.local:6379
            - name: WORKER_IMAGE_REGISTRY
              value: ghcr.io/secflow
            - name: WORKER_IMAGE_TAG
              value: "1.0.0"
            - name: WORKER_IMAGE_PULL_POLICY
              value: IfNotPresent
            - name: WORKER_PROVISION_TIMEOUT_SECONDS
              value: "90"
            - name: WORKER_SCALE_WAIT_TIMEOUT_SECONDS
              value: "15"
            - name: WORKER_RECONCILE_INTERVAL_SECONDS
              value: "10"
            - name: WORKER_IDLE_TTL_SECONDS
              value: "120"
            - name: WORKER_MAX_REPLICAS
              value: "5"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
