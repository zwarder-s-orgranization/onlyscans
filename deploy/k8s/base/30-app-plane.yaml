apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: secflow-app
  labels:
    app: web
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: secflow-app
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/secflow/web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://secflow.local
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plugin-provisioner
  namespace: secflow-app
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secflow-plugin-provisioner
  namespace: secflow-sandbox
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secflow-plugin-provisioner
  namespace: secflow-sandbox
subjects:
  - kind: ServiceAccount
    name: plugin-provisioner
    namespace: secflow-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secflow-plugin-provisioner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-provisioner
  namespace: secflow-app
  labels:
    app: plugin-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-provisioner
  template:
    metadata:
      labels:
        app: plugin-provisioner
    spec:
      serviceAccountName: plugin-provisioner
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plugin-provisioner
          image: ghcr.io/secflow/plugin-provisioner:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
          env:
            - name: HTTP_ADDR
              value: ":8089"
            - name: PROVISIONER_DRIVER
              value: k8s
            - name: SECFLOW_ENV
              value: development
            - name: SANDBOX_NAMESPACE
              value: secflow-sandbox
            - name: ORCHESTRATOR_ADDR
              value: orchestrator.secflow-app.svc.cluster.local:50051
            - name: ORCHESTRATOR_NAMESPACE
              value: secflow-app
            - name: GARAGE_ENDPOINT
              value: http://garage.secflow-system.svc.cluster.local:3900
            - name: GARAGE_NAMESPACE
              value: secflow-system
            - name: PLUGIN_IMAGE_REGISTRY_ALLOWLIST
              value: ghcr.io/secflow,secflow
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secflow-db
                  key: DATABASE_URL
            - name: GARAGE_RO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-creds
                  key: ACCESS_KEY_ID
                  optional: true
            - name: GARAGE_RO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-creds
                  key: SECRET_ACCESS_KEY
                  optional: true
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
