apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secflow
  namespace: secflow-app
spec:
  ingressClassName: nginx
  rules:
    - host: secflow.local
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  number: 8080
          - path: /upload
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  number: 8080
          - path: /catalogs
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  number: 8080
          - path: /runs
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  number: 8080
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
