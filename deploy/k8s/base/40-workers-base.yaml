# Pure pull workers (worker-kotlin, worker-sca, sbom-service) are NOT statically deployed here:
# Orchestrator creates and scales them in secflow-workers dynamically via the Kubernetes API on demand!
# Dual-role services (gRPC server + pull worker) are deployed with minReplicas=1 and auto-scaled by orchestrator under load.
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: secflow-workers
  labels:
    app: ai-service
spec:
  ports:
    - name: grpc
      port: 50053
      targetPort: grpc
    - name: http
      port: 8086
      targetPort: http
  selector:
    app: ai-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: secflow-workers
  labels:
    app: ai-service
    secflow.io/worker-pool: ai-service
    secflow.io/egress-tier: egress-external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        secflow.io/worker-pool: ai-service
        secflow.io/egress-tier: egress-external
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: ghcr.io/secflow/ai-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50053
            - name: http
              containerPort: 8086
          env:
            - name: GRPC_ADDR
              value: ":50053"
            - name: HTTP_ADDR
              value: ":8086"
            - name: ORCHESTRATOR_ADDR
              value: orchestrator.secflow-app.svc.cluster.local:50051
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secflow-worker-auth
                  key: SERVICE_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secflow-db
                  key: DATABASE_URL
            - name: REDIS_ADDR
              value: redis.secflow-system.svc.cluster.local:6379
            - name: AI_PROVIDER
              value: template_fallback
            - name: GARAGE_ENDPOINT
              value: http://garage.secflow-system.svc.cluster.local:3900
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-creds
                  key: GARAGE_ACCESS_KEY
                  optional: true
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-garage-creds
                  key: GARAGE_SECRET_KEY
                  optional: true
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
