# Default development secrets. Override via Kustomize secretGenerator or external secret manager in production.
apiVersion: v1
kind: Secret
metadata:
  name: secflow-postgres
  namespace: secflow-system
type: Opaque
stringData:
  POSTGRES_DB: secflow
  POSTGRES_USER: secflow
  POSTGRES_PASSWORD: secflow-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-db
  namespace: secflow-app
type: Opaque
stringData:
  DATABASE_URL: postgres://secflow:secflow-dev-password@postgres.secflow-system.svc.cluster.local:5432/secflow?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-db
  namespace: secflow-workers
type: Opaque
stringData:
  DATABASE_URL: postgres://secflow:secflow-dev-password@postgres.secflow-system.svc.cluster.local:5432/secflow?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-auth
  namespace: secflow-app
type: Opaque
stringData:
  JWT_SECRET: secflow-dev-jwt-secret-change-in-prod-32chars
  SERVICE_TOKEN: secflow-dev-service-token-change-in-prod
  SECRET_KEY: secflow-dev-secret-box-key-change-in-prod
  LEASE_SECRET: secflow-dev-lease-secret-change-in-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-worker-auth
  namespace: secflow-workers
type: Opaque
stringData:
  SERVICE_TOKEN: secflow-dev-service-token-change-in-prod
  LLM_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-sandbox-runtime-auth
  namespace: secflow-sandbox
type: Opaque
stringData:
  SERVICE_TOKEN: secflow-dev-service-token-change-in-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-garage-admin
  namespace: secflow-system
type: Opaque
stringData:
  GARAGE_ADMIN_TOKEN: secflow-dev-garage-admin-token
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-garage-admin
  namespace: secflow-app
type: Opaque
stringData:
  GARAGE_ADMIN_TOKEN: secflow-dev-garage-admin-token
