apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-system-ingress
  namespace: secflow-system
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: secflow-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: secflow-workers
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: secflow-sandbox
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: secflow-system
