# ==============================================================================
# Angie reverse-proxy + automatic Let's Encrypt ACME TLS for OnlyScans on k3s
# Mount this file as: /etc/angie/http.d/onlyscans.conf
#
# Prerequisites:
#   1. Replace `onlyscans.example.com`, `grafana.onlyscans.example.com`,
#      `argocd.onlyscans.example.com` and `admin@onlyscans.example.com`
#      with your real domains and email.
#   2. Replace `192.168.0.254` if your k3s host LAN IP differs (or use
#      `host.docker.internal` if `extra_hosts: ["host.docker.internal:host-gateway"]`
#      is configured in Angie's docker-compose.yml).
#   3. Persist `/var/lib/angie/acme` as a Docker volume so certificates survive
#      Angie container restarts and don't hit Let's Encrypt rate limits.
#   4. Ensure ports 80 and 443 are published to the Angie container and reachable
#      from the internet for HTTP-01 ACME verification.
#   5. NodePorts exposed by k3s:
#        - 30300 -> secflow-app/web
#        - 30808 -> secflow-app/edge-gateway
#        - 30301 -> secflow-observability/grafana
#        - 30480 -> argocd/argocd-server (with server.insecure: "true")
# ==============================================================================

resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Separate ACME clients per domain so one unconfigured DNS record never blocks
# certificate issuance for the other domains.
acme_client onlyscans_app     https://acme-v02.api.letsencrypt.org/directory email=admin@onlyscans.example.com;
acme_client onlyscans_grafana https://acme-v02.api.letsencrypt.org/directory email=admin@onlyscans.example.com;
acme_client onlyscans_argocd  https://acme-v02.api.letsencrypt.org/directory email=admin@onlyscans.example.com;

# HTTP -> HTTPS redirect (Angie automatically handles /.well-known/acme-challenge/ on port 80)
server {
    listen 80;
    server_name onlyscans.example.com grafana.onlyscans.example.com argocd.onlyscans.example.com;

    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 1. OnlyScans Platform (Next.js UI + Edge Gateway API / GraphQL / WS / MCP SSE)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name onlyscans.example.com;

    acme onlyscans_app;
    ssl_certificate     $acme_cert_onlyscans_app;
    ssl_certificate_key $acme_cert_key_onlyscans_app;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ONLYSCANS_SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64m;

    # API, GraphQL + WebSocket subscriptions, uploads, webhooks and MCP SSE -> edge-gateway (30808)
    location ~ ^/(graphql|upload|catalogs|runs|webhooks|mcp|api) {
        proxy_pass http://192.168.0.254:30808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend Next.js UI -> web (30300)
    location / {
        proxy_pass http://192.168.0.254:30300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# ------------------------------------------------------------------------------
# 2. Grafana (Metrics, Loki Logs, Tempo Traces, OnlyScans Platform Overview)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name grafana.onlyscans.example.com;

    acme onlyscans_grafana;
    ssl_certificate     $acme_cert_onlyscans_grafana;
    ssl_certificate_key $acme_cert_key_onlyscans_grafana;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://192.168.0.254:30301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# ------------------------------------------------------------------------------
# 3. Argo CD UI & API (expects argocd-cmd-params-cm -> server.insecure: "true")
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name argocd.onlyscans.example.com;

    acme onlyscans_argocd;
    ssl_certificate     $acme_cert_onlyscans_argocd;
    ssl_certificate_key $acme_cert_key_onlyscans_argocd;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://192.168.0.254:30480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
