# Copy and fill with a GitHub PAT (read:packages) if GHCR packages are private,
# then apply to namespace argocd:
#   kubectl apply -f oci-repository-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: onlyscans-ghcr-oci-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: onlyscans-ghcr-charts
  url: ghcr.io/zwarder-s-orgranization/charts
  enableOCI: "true"
  username: "<github-username>"
  password: "<github-pat-with-read-packages>"
