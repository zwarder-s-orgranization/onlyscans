apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: {{ .Values.namespaces.system }}
  labels:
    app: garage
    {{- include "secflow.commonLabels" . | nindent 4 }}
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "{{ .Values.garage.rpcSecret }}"

    [s3_api]
    s3_region = "{{ .Values.garage.region }}"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.localhost"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "{{ .Values.garage.adminToken }}"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: {{ .Values.namespaces.system }}
  labels:
    app: garage
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
    - name: admin
      port: 3903
      targetPort: 3903
  selector:
    app: garage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: {{ .Values.namespaces.system }}
  labels:
    app: garage
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
        {{- include "secflow.commonLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: garage
          image: {{ .Values.garage.image }}
          imagePullPolicy: IfNotPresent
          args: ["/garage", "-c", "/etc/garage.toml", "server"]
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          resources:
            {{- toYaml .Values.garage.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: garage-data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: garage-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClassName }}
        storageClassName: {{ .Values.global.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.garage.storageSize }}
