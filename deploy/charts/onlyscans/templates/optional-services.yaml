{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.namespaces.system }}
  labels:
    app: ollama
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  selector:
    app: ollama
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: {{ .Values.namespaces.system }}
  labels:
    app: ollama
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        {{- include "secflow.commonLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
  volumeClaimTemplates:
    - metadata:
        name: ollama-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClassName }}
        storageClassName: {{ .Values.global.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ollama.storageSize }}
{{- end }}
{{- if .Values.mailpit.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: {{ .Values.namespaces.system }}
  labels:
    app: mailpit
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
  selector:
    app: mailpit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: {{ .Values.namespaces.system }}
  labels:
    app: mailpit
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
        {{- include "secflow.commonLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
{{- end }}
