apiVersion: v1
kind: Service
metadata:
  name: source-ingester
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: source-ingester
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
    - name: http
      port: 8082
      targetPort: http
  selector:
    app: source-ingester
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-ingester
  namespace: {{ .Values.namespaces.app }}
  labels:
    app: source-ingester
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sourceIngester.replicas }}
  selector:
    matchLabels:
      app: source-ingester
  template:
    metadata:
      labels:
        app: source-ingester
        {{- include "secflow.commonLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "secflow.podSecurityContext" . | nindent 8 }}
      containers:
        - name: source-ingester
          image: {{ include "secflow.image" (dict "root" . "repo" .Values.sourceIngester.imageRepository) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: 50052
            - name: http
              containerPort: 8082
          env:
            - name: GRPC_ADDR
              value: ":50052"
            - name: HTTP_ADDR
              value: ":8082"
            - name: ORCHESTRATOR_ADDR
              value: {{ include "secflow.orchestratorAddr" . | quote }}
            - name: REPO_ALLOWLIST
              value: {{ .Values.global.repoAllowlist | quote }}
            - name: GARAGE_ENDPOINT
              value: {{ include "secflow.garageEndpoint" . | quote }}
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.garage.secretName }}
                  key: GARAGE_ACCESS_KEY
                  optional: true
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.garage.secretName }}
                  key: GARAGE_SECRET_KEY
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "secflow.otelEndpoint" . | quote }}
          securityContext:
            {{- include "secflow.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.sourceIngester.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
