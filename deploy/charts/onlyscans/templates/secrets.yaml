apiVersion: v1
kind: Secret
metadata:
  name: secflow-db
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "secflow.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "secflow.databaseUrl" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-db
  namespace: {{ .Values.namespaces.workers }}
  labels:
    {{- include "secflow.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "secflow.databaseUrl" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-postgres
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "secflow.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-auth
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "secflow.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  SERVICE_TOKEN: {{ .Values.auth.serviceToken | quote }}
  SECRET_KEY: {{ .Values.auth.secretKey | quote }}
  LEASE_SECRET: {{ .Values.auth.leaseSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-worker-auth
  namespace: {{ .Values.namespaces.workers }}
  labels:
    {{- include "secflow.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  SERVICE_TOKEN: {{ .Values.auth.serviceToken | quote }}
  LLM_API_KEY: {{ .Values.ai.llmApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-sandbox-runtime-auth
  namespace: {{ .Values.namespaces.sandbox }}
  labels:
    {{- include "secflow.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  SERVICE_TOKEN: {{ .Values.auth.serviceToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-garage-admin
  namespace: {{ .Values.namespaces.system }}
  labels:
    {{- include "secflow.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  GARAGE_ADMIN_TOKEN: {{ .Values.garage.adminToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: secflow-garage-admin
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "secflow.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  GARAGE_ADMIN_TOKEN: {{ .Values.garage.adminToken | quote }}
