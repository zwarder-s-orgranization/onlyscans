# Dual-role worker + gRPC services (always deployed with Services; scaled up/down dynamically by orchestrator or KEDA).
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: {{ .Values.namespaces.workers }}
  labels:
    app: ai-service
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  ports:
    - name: grpc
      port: 50053
      targetPort: grpc
    - name: http
      port: 8086
      targetPort: http
  selector:
    app: ai-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: {{ .Values.namespaces.workers }}
  labels:
    app: ai-service
    secflow.io/worker-pool: ai-service
    secflow.io/egress-tier: egress-external
    {{- include "secflow.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workerScaling.pools.aiService.minReplicas }}
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        secflow.io/worker-pool: ai-service
        secflow.io/egress-tier: egress-external
        {{- include "secflow.commonLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "secflow.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ai-service
          image: {{ include "secflow.image" (dict "root" . "repo" "ai-service") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: 50053
            - name: http
              containerPort: 8086
          env:
            - name: GRPC_ADDR
              value: ":50053"
            - name: HTTP_ADDR
              value: ":8086"
            - name: ORCHESTRATOR_ADDR
              value: {{ include "secflow.orchestratorAddr" . | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secflow-worker-auth
                  key: SERVICE_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secflow-db
                  key: DATABASE_URL
            - name: REDIS_ADDR
              value: {{ include "secflow.redisAddr" . | quote }}
            - name: AI_PROVIDER
              value: {{ .Values.ai.provider | quote }}
            - name: OLLAMA_URL
              value: {{ .Values.ai.ollamaUrl | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.ai.ollamaModel | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.ai.llmBaseUrl | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secflow-worker-auth
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_MODEL
              value: {{ .Values.ai.llmModel | quote }}
            - name: MCP_ALLOW_PRIVATE
              value: {{ if .Values.ai.allowPrivateMcp }}"1"{{ else }}"0"{{ end }}
            - name: GARAGE_ENDPOINT
              value: {{ include "secflow.garageEndpoint" . | quote }}
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.garage.secretName }}
                  key: GARAGE_ACCESS_KEY
                  optional: true
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.garage.secretName }}
                  key: GARAGE_SECRET_KEY
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "secflow.otelEndpoint" . | quote }}
          securityContext:
            {{- include "secflow.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: {{ .Values.workerScaling.pools.aiService.cpuRequest }}
              memory: {{ .Values.workerScaling.pools.aiService.memoryRequest }}
            limits:
              cpu: {{ .Values.workerScaling.pools.aiService.cpuLimit }}
              memory: {{ .Values.workerScaling.pools.aiService.memoryLimit }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.workerScaling.pools.aiService.emptyDirSizeLimit }}
---
