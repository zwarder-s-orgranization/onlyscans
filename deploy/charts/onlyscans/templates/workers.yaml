{{- if or (ne .Values.workerScaling.mode "orchestrator") .Values.workerScaling.precreatePureWorkers }}
{{- $pureWorkers := list
  (dict "name" "worker-kotlin" "pool" .Values.workerScaling.pools.workerKotlin)
  (dict "name" "worker-sca" "pool" .Values.workerScaling.pools.workerSca)
  (dict "name" "sbom-service" "pool" .Values.workerScaling.pools.sbomService)
}}
{{- range $w := $pureWorkers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $w.name }}
  namespace: {{ $.Values.namespaces.workers }}
  labels:
    app: {{ $w.name }}
    secflow.io/worker-pool: {{ $w.name }}
    secflow.io/egress-tier: internal-only
    {{- include "secflow.commonLabels" $ | nindent 4 }}
spec:
  replicas: {{ if eq $.Values.workerScaling.mode "static" }}{{ max 1 $w.pool.minReplicas }}{{ else }}{{ $w.pool.minReplicas }}{{ end }}
  selector:
    matchLabels:
      app: {{ $w.name }}
  template:
    metadata:
      labels:
        app: {{ $w.name }}
        secflow.io/worker-pool: {{ $w.name }}
        secflow.io/egress-tier: internal-only
        {{- include "secflow.commonLabels" $ | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "secflow.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $w.name }}
          image: {{ include "secflow.image" (dict "root" $ "repo" $w.name) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: ORCHESTRATOR_ADDR
              value: {{ include "secflow.orchestratorAddr" $ | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secflow-worker-auth
                  key: SERVICE_TOKEN
            - name: GARAGE_ENDPOINT
              value: {{ include "secflow.garageEndpoint" $ | quote }}
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.garage.secretName }}
                  key: GARAGE_ACCESS_KEY
                  optional: true
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.garage.secretName }}
                  key: GARAGE_SECRET_KEY
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "secflow.otelEndpoint" $ | quote }}
          securityContext:
            {{- include "secflow.containerSecurityContext" $ | nindent 12 }}
          resources:
            requests:
              cpu: {{ $w.pool.cpuRequest }}
              memory: {{ $w.pool.memoryRequest }}
            limits:
              cpu: {{ $w.pool.cpuLimit }}
              memory: {{ $w.pool.memoryLimit }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $w.pool.emptyDirSizeLimit }}
{{- end }}
{{- end }}
